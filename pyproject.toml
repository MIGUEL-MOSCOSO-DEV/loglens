[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-desktop"
version = "1.0.0"
description = "A desktop log reader with streaming search, live tailing and saved filters."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Miguel Moscoso", email = "miguelmoscoso.devperu@gmail.com"}]
dependencies = []

[project.scripts]
loglens = "loglens.app:main"

[project.urls]
Repository = "https://github.com/MIGUEL-MOSCOSO-DEV/loglens"
Issues = "https://github.com/MIGUEL-MOSCOSO-DEV/loglens/issues"

[tool.setuptools.packages.find]
include = ["loglens*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
